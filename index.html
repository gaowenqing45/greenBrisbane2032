<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Green Brisbane 2032 Olympic: See it. Join it. Share it.</title>
  <meta name="description" content="Green Brisbane 2032 Olympic — See it. Join it. Share it." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --green-900:#0e3b2e;
      --green-800:#135b43;
      --green-700:#1b7a55;
      --green-600:#259a67;
      --green-500:#31b57b;
      --green-300:#90d5b5;
      --green-100:#e6f6ee;
      --ink:#0c1b16;
      --muted:#4f6b60;
      --bg:#f6fbf8;
      --ring:#e0f2ea;
      --card:#ffffff;
      --shadow: 0 10px 30px rgba(0,0,0,.10);
      --radius: 16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;}
    body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; color:var(--ink); background:linear-gradient(180deg,var(--bg),#fff);}    
    a{color:var(--green-700); text-decoration:none}
    a:hover{color:var(--green-900); text-decoration:underline}
    .container{max-width:1100px; margin:0 auto; padding:0 20px}
    .nav{position:sticky; top:0; z-index:50; backdrop-filter:saturate(1.2) blur(8px); background:rgba(246,251,248,.85); border-bottom:1px solid var(--ring);}
    .nav-inner{display:flex; align-items:center; justify-content:space-between; padding:14px 0}
    .brand{display:flex; align-items:center; gap:12px}
    .brand .mark{width:40px; height:40px; border-radius:12px; background:conic-gradient(from 140deg, var(--green-600), var(--green-300)); display:grid; place-items:center; box-shadow: var(--shadow)}
    .brand-title{font-weight:700; letter-spacing:.2px}
    .nav a.btn{padding:10px 14px; border-radius:12px; background:var(--green-600); color:#fff; box-shadow: var(--shadow); border:1px solid #0d6b4d; text-decoration:none}
    .nav a.btn.secondary{background:#fff; color:var(--green-800); border:1px solid var(--ring)}
    .hero{position:relative; overflow:hidden; background: radial-gradient(1200px 500px at 10% -20%, #c9efdf 0%, rgba(201,239,223,0) 60%), radial-gradient(900px 600px at 110% 10%, #eaf9f1 0%, rgba(234,249,241,0) 60%);}
    .hero .container{display:grid; grid-template-columns:1.15fr .85fr; gap:28px; padding:56px 20px 28px}
    .h-title{font-size:clamp(28px,4vw,48px); line-height:1.08; margin:6px 0 12px; color:var(--green-900)}
    .h-sub{font-size:clamp(15px,2.3vw,18px); color:var(--muted)}
    .badges{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
    .badge{font-size:12px; padding:6px 10px; border-radius:999px; background:#fff; border:1px solid var(--ring); color:var(--green-800)}
    .hero-card{background:linear-gradient(180deg,#ffffff, #f3fbf7); border:1px solid var(--ring); border-radius:18px; padding:18px; box-shadow: var(--shadow)}
    .rings{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
    .ring{width:20px; height:20px; border:3px solid var(--green-600); border-radius:50%}
    .ring.muted{border-color:var(--green-300)}
    .legal-note{font-size:12px; color:#3e5c51; margin-top:8px}
    .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
    .card{background:var(--card); border:1px solid var(--ring); border-radius:var(--radius); padding:18px; box-shadow: var(--shadow)}
    .card h3{margin:0 0 6px; font-size:18px; color:var(--green-800)}
    .card p{margin:8px 0 0; color:var(--muted); font-size:14px}
    .dash{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:14px}
    .gauge{border-radius:16px; padding:16px; background:linear-gradient(180deg,#f7fff9,#eefbf3); border:1px solid var(--ring); box-shadow: var(--shadow)}
    .metric{font-size:40px; font-weight:800; color:var(--green-900)}
    .unit{font-size:12px; color:var(--muted)}
    .gauge img{width:100%; height:140px; object-fit:cover; border-radius:12px; border:1px solid var(--ring); background:#fff}
    .section{padding:40px 0}
    .section h2{font-size:28px; margin:0 0 6px; color:var(--green-900)}
    .section .lead{color:var(--muted); margin:0 0 10px}
    .cta{display:flex; gap:12px; margin-top:16px}
    .btn{display:inline-block; padding:12px 16px; border-radius:12px; border:1px solid var(--ring); background:#fff; color:var(--green-900); text-decoration:none; font-weight:600; box-shadow: var(--shadow)}
    .btn.primary{background:var(--green-600); color:#fff; border-color:#0d6b4d}
    .footer{margin-top:40px; padding:26px 0; background:#f3fbf7; border-top:1px solid var(--ring); color:var(--muted)}
    .blog-hero{background:linear-gradient(180deg,#e9faf2,#fff); border-bottom:1px solid var(--ring)}
    .blog-hero .container{padding:40px 20px}
    .blog-title{font-size:clamp(28px,3.5vw,42px); margin:6px 0; color:var(--green-900)}
    .prose{max-width:850px; margin:0 auto; font-size:17px; line-height:1.7; color:var(--ink)}
    .prose h2{color:var(--green-800); margin-top:28px}
    .quote{border-left:4px solid var(--green-500); padding-left:14px; background:#f6fbf8; border-radius:8px; margin:14px 0; color:#1a3a30}
    .alt{font-size:13px; color:var(--muted); margin-top:4px}
    @media (max-width:960px){.hero .container{grid-template-columns:1fr;}.grid{grid-template-columns:1fr}.dash{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="nav" role="banner">
    <div class="container nav-inner">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 9c0-3.5 3-6 6-6 2 0 4 1 4 3 0 1.2-.6 2.1-1.7 2.8C18 9.5 19 10.9 19 13c0 2.8-2.2 5-5 5-3.5 0-7-2.8-7-7z" fill="url(#g)"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#31b57b"/><stop offset="1" stop-color="#90d5b5"/></linearGradient></defs>
          </svg>
        </div>
        <div>
          <div class="brand-title">Green Brisbane 2032</div>
          <div style="font-size:12px; color:var(--muted)">See it. Join it. Share it.</div>
        </div>
      </div>
      <nav aria-label="Primary">
        <a href="#home" class="btn secondary" data-link>Home</a>
        <a href="#blog" class="btn" data-link>Blog</a>
      </nav>
    </div>
  </header>
  <!-- Rest of original detailed HTML retained -->
</body>
</html>
